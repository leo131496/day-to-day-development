<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b53d7"><title>序 · 项目工作台</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<section id="login" hidden><div class="login-art"><div class="brand"><span class="brandmark">序</span> PROJECT SPACE</div><div><div class="eyebrow">CLARITY IN EVERY STEP</div><h1>把计划，<br>变成每一天的进展。</h1><p>项目、任务、交付与协作，<br>在一个清晰的空间里，有序发生。</p><div class="art-grid"><span>01 / 计划</span><span>02 / 行动</span><span>03 / 交付</span></div></div><small>让每一份投入，都有迹可循。</small></div><form id="login-form"><span class="brandmark">序</span><h2>欢迎回到项目空间</h2><p class="muted">输入工作空间密码，继续你的项目。</p><label>访问密码<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入访问密码"></label><p id="login-error" class="error" role="alert"></p><button class="primary" type="submit">进入工作台 <span>↗</span></button><p class="login-note">首次运行的密码保存在项目 data 文件夹中。</p></form></section>
<div id="workspace" hidden>
<aside class="sidebar"><a class="brand" href="/" aria-label="项目工作台首页"><span class="brandmark">序</span><span>项目工作台<small>PROJECT SPACE</small></span></a><div class="workspace-label">工作空间 <span class="small-dot"></span></div><button id="home" class="nav active"><span>▦</span> 项目总览</button><button id="trash" class="nav"><span>▤</span> 项目回收站</button><div class="side-section"><span>我的项目</span><button id="side-add" aria-label="新建项目">＋</button></div><div id="project-list"></div><div class="sidebar-bottom"><div class="storage-card"><span class="small-dot"></span><strong>每一次进展，都有记录</strong><p>数据库保存 · 历史版本 · 定时备份</p></div><button id="logout" class="nav"><span>↪</span> 退出空间</button></div></aside>
<div class="main-shell"><header class="topbar"><button id="mobile-menu" aria-label="打开导航">☰</button><div id="breadcrumb">工作空间 <span>/</span> 项目总览</div><div class="topbar-right"><span id="connection"><i class="small-dot"></i> 已连接</span><span class="avatar">项</span></div></header><main id="main"></main><footer><span>序 · 让项目有序推进</span><span id="backup-status">正在读取保存状态…</span></footer></div>
</div>
<dialog id="editor" aria-labelledby="editor-title"></dialog><dialog id="project-editor" aria-labelledby="project-editor-title"></dialog><div id="toast" role="status" hidden></div>
</body></html>
